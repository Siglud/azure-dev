# Tier 2 (cloud E2E) — `invoke` SESSION vs CONVERSATION memory semantics.
#
# A SESSION and a CONVERSATION are distinct concepts. For the responses-protocol
# agent (Basic Responses), multi-turn memory is bound to the CONVERSATION, not the
# session: `--new-session` resets both IDs and memory, while
# `--new-conversation` resets conversation memory but retains the session.
#
# Precondition: 2.00-setup-deploy-shared-agent.yaml has been run successfully.
name: "invoke-session-vs-conversation"
command: "bash"
cwd: "~/working/azd-agents-shared/{shared_agent_name}"
tags: ["tier:2", "cmd:invoke", "serial-only"]
requires: "tier2/2.00-setup-deploy-shared-agent.yaml"

# Precondition guard: warn (do not hard-fail) if the shared agent is not deployed.
pre:
  - run: "test -f ~/working/azd-agents-shared/{shared_agent_name}/azure.yaml && echo 'OK: shared agent project found' || echo 'PRECONDITION FAILED: shared agent not found - run 2.00-setup-deploy-shared-agent.yaml first'"
    cwd: "~/working/azd-agents-shared/{shared_agent_name}"
    name: "assert shared agent is deployed"
    continue_on_error: true

goals:
  - "Run: azd ai agent invoke \"My name is Quinn. Remember it.\" and wait for a response. Record the session and conversation IDs."
  - "Run: azd ai agent invoke \"What is my name?\" and confirm the agent recalls 'Quinn' and both IDs are unchanged."
  - "Run: azd ai agent invoke --new-session \"What is my name?\" and confirm the agent does NOT recall 'Quinn'. Verify both the session ID and conversation ID differ from the previous invoke. Record the new IDs."
  - "Run: azd ai agent invoke \"My name is Quinn. Remember it.\" and confirm both IDs are reused."
  - "Run: azd ai agent invoke --new-conversation \"What is my name?\" and confirm the agent does NOT recall 'Quinn'. Verify the conversation ID changes but the session ID stays the same. Record the IDs."
  - "Run: azd ai agent invoke --new-session --new-conversation \"Hello!\" and confirm it succeeds with both IDs different from the previous invoke."
  - "Take a screenshot after each invoke."
  - "Report a finding if any memory or ID assertion fails, or if using both reset flags is rejected. Compare actual assigned session IDs, not a '(new)' placeholder."
